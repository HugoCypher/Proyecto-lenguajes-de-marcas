<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula XML - Laboratorio</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .lab {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .lab { grid-template-columns: 1fr; }
    }
    textarea {
      width: 100%;
      min-height: 260px;
      font-family: var(--mono);
      font-size: 0.9rem;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background: var(--blanco);
      color: var(--texto);
      resize: vertical;
    }
    .resultado {
      min-height: 260px;
      background: var(--gris-claro);
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 12px;
      font-size: 0.9rem;
    }
    .ok { color: #059669; }
    .error { color: #dc2626; margin: 6px 0; }
    .botones { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="index.html" class="logo">
        <span>XML</span>
        <span>Aula XML</span>
      </a>
      <nav id="menu">
        <a href="index.html">Inicio</a>
        <a href="temario.html">Temario</a>
        <a href="laboratorio.html" class="activo">Laboratorio</a>
        <a href="practicas.html">Prácticas</a>
        <a href="progreso.html">Mi progreso</a>
      </nav>
      <div class="header-botones">
        <button class="btn-tema" id="cambiarTema">🌓</button>
        <button class="btn-menu" id="abrirMenu">☰</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Laboratorio XML</h1>
      <p style="color: var(--texto2); margin-bottom: 20px;">
        Pega un XML y comprueba si está bien formado (etiquetas, anidación, raíz y atributos).
      </p>

      <div class="lab">
        <div>
          <label for="xmlInput" style="font-weight: 600;">Código XML</label>
          <textarea id="xmlInput" placeholder="Ejemplo:
<?xml version=&quot;1.0&quot;?>
<libro>
  <titulo>XML</titulo>
</libro>"></textarea>
          <div class="botones">
            <button class="boton boton-verde" id="btnAnalizar">Analizar</button>
            <button class="boton boton-borde" id="btnLimpiar">Limpiar</button>
          </div>
        </div>
        <div>
          <label style="font-weight: 600;">Resultado</label>
          <div class="resultado" id="resultado">Aquí saldrá el análisis.</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>Aula XML - Hugo Fernández Riquelme - 2026</p>
      <p>Lenguajes de marcas</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    function analizarXML(texto) {
      var errores = [];
      var t = texto.trim();

      if (!t) {
        errores.push("No has escrito ningún XML.");
        return errores;
      }

      // Quitar declaración XML y comentarios para simplificar
      t = t.replace(/<\?xml[^?]*\?>/gi, "");
      t = t.replace(/<!--[\s\S]*?-->/g, "");
      t = t.trim();

      // Comprobar atributos sin comillas (muy básico)
      if (/\s\w+=[^"'\s>]+/.test(t)) {
        errores.push("Hay atributos sin comillas. Deben ir entre comillas.");
      }

      // Contar etiquetas de apertura y cierre (sin autocierre)
      var abiertas = t.match(/<[a-zA-Z_][\w:.-]*(?:\s[^>]*)?>/g) || [];
      var cerradas = t.match(/<\/[a-zA-Z_][\w:.-]*>/g) || [];
      var auto = t.match(/<[a-zA-Z_][\w:.-]*[^>]*\/>/g) || [];

      // Filtrar las de autocierre de las abiertas
      abiertas = abiertas.filter(function (e) {
        return !e.endsWith("/>");
      });

      if (abiertas.length !== cerradas.length) {
        errores.push("El número de etiquetas de apertura y de cierre no coincide.");
      }

      // Pila para anidación y nombres
      var pila = [];
      var regex = /<\/?([a-zA-Z_][\w:.-]*)[^>]*\/?>/g;
      var m;
      var raiz = null;
      var numRaices = 0;

      while ((m = regex.exec(t)) !== null) {
        var etiqueta = m[0];
        var nombre = m[1];

        if (etiqueta.endsWith("/>")) {
          // autocierre, no entra en pila
          if (pila.length === 0) {
            numRaices++;
            if (!raiz) raiz = nombre;
          }
          continue;
        }

        if (etiqueta.startsWith("</")) {
          if (pila.length === 0) {
            errores.push("Etiqueta de cierre inesperada: </" + nombre + ">");
          } else {
            var ultima = pila.pop();
            if (ultima !== nombre) {
              errores.push("Etiqueta mal cerrada: se abrió <" + ultima + "> y se cerró </" + nombre + ">");
            }
          }
        } else {
          if (pila.length === 0) {
            numRaices++;
            if (!raiz) raiz = nombre;
          }
          pila.push(nombre);
        }
      }

      if (pila.length > 0) {
        errores.push("Quedan etiquetas sin cerrar: " + pila.join(", "));
      }

      if (numRaices > 1) {
        errores.push("Hay más de una raíz. Solo puede haber una.");
      }

      if (numRaices === 0 && t.length > 0) {
        errores.push("No se ha encontrado un elemento raíz.");
      }

      return errores;
    }

    document.getElementById("btnAnalizar").onclick = function () {
      var texto = document.getElementById("xmlInput").value;
      var errores = analizarXML(texto);
      var caja = document.getElementById("resultado");

      if (errores.length === 0) {
        caja.innerHTML = '<p class="ok"><strong>Bien formado.</strong> No se han detectado errores básicos.</p>';
      } else {
        var html = "<p><strong>Errores encontrados:</strong></p>";
        for (var i = 0; i < errores.length; i++) {
          html += '<p class="error">• ' + errores[i] + "</p>";
        }
        caja.innerHTML = html;
      }
    };

    document.getElementById("btnLimpiar").onclick = function () {
      document.getElementById("xmlInput").value = "";
      document.getElementById("resultado").innerHTML = "Aquí saldrá el análisis.";
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula XML - Laboratorio</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .lab {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .lab { grid-template-columns: 1fr; }
    }
    textarea {
      width: 100%;
      min-height: 260px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.9rem;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background: var(--blanco);
      color: var(--texto);
      resize: vertical;
    }
    .resultado {
      min-height: 260px;
      background: var(--gris-claro);
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 12px;
      font-size: 0.9rem;
    }
    .ok { color: #059669; }
    .error { color: #dc2626; margin: 6px 0; }
    .botones { margin-top: 10px; display: flex; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="index.html" class="logo">
        <span>XML</span>
        <span>Aula XML</span>
      </a>
      <nav id="menu">
        <a href="index.html">Inicio</a>
        <a href="temario.html">Temario</a>
        <a href="laboratorio.html" class="activo">Laboratorio</a>
        <a href="practicas.html">Prácticas</a>
        <a href="progreso.html">Mi progreso</a>
      </nav>
      <div class="header-botones">
        <button class="btn-tema" id="cambiarTema">🌓</button>
        <button class="btn-menu" id="abrirMenu">☰</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Laboratorio XML</h1>
      <p style="color: var(--texto2); margin-bottom: 20px;">
        Pega un XML y comprueba si está bien formado.
      </p>

      <div class="lab">
        <div>
          <label for="xmlInput" style="font-weight: 600;">Código XML</label>
          <textarea id="xmlInput"></textarea>
          <div class="botones">
            <button class="boton boton-verde" id="btnAnalizar">Analizar</button>
            <button class="boton boton-borde" id="btnLimpiar">Limpiar</button>
          </div>
        </div>
        <div>
          <label style="font-weight: 600;">Resultado</label>
          <div class="resultado" id="resultado">Aquí saldrá el análisis.</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>Aula XML - Hugo Fernández Riquelme - 2026</p>
      <p>Lenguajes de marcas</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    function analizar(texto) {
      var errores = [];
      var t = texto.trim();

      if (t === "") {
        errores.push("No has escrito nada.");
        return errores;
      }

      // Buscar todas las etiquetas
      var pila = [];
      var raices = 0;
      var re = /<\/?([a-zA-Z_][\w:.-]*)[^>]*\/?>/g;
      var m;

      while ((m = re.exec(t)) !== null) {
        var etiq = m[0];
        var nombre = m[1];

        // Etiqueta de autocierre: <algo />
        if (etiq.charAt(etiq.length - 2) === "/") {
          if (pila.length === 0) raices++;
          continue;
        }

        // Cierre: </algo>
        if (etiq.charAt(1) === "/") {
          if (pila.length === 0) {
            errores.push("Cierre inesperado: </" + nombre + ">");
          } else {
            var ultimo = pila.pop();
            if (ultimo !== nombre) {
              errores.push("Se abrió <" + ultimo + "> y se cerró </" + nombre + ">");
            }
          }
        } else {
          // Apertura: <algo>
          if (pila.length === 0) raices++;
          pila.push(nombre);
        }
      }

      if (pila.length > 0) {
        errores.push("Etiquetas sin cerrar: " + pila.join(", "));
      }

      if (raices === 0) {
        errores.push("No hay elemento raíz.");
      }

      if (raices > 1) {
        errores.push("Hay más de una raíz (solo puede haber una).");
      }

      return errores;
    }

    document.getElementById("btnAnalizar").onclick = function () {
      var texto = document.getElementById("xmlInput").value;
      var errores = analizar(texto);
      var caja = document.getElementById("resultado");

      if (errores.length === 0) {
        caja.innerHTML = '<p class="ok"><strong>Bien formado.</strong></p>';
      } else {
        var html = "<p><strong>Errores:</strong></p>";
        for (var i = 0; i < errores.length; i++) {
          html += '<p class="error">- ' + errores[i] + "</p>";
        }
        caja.innerHTML = html;
      }
    };

    document.getElementById("btnLimpiar").onclick = function () {
      document.getElementById("xmlInput").value = "";
      document.getElementById("resultado").innerHTML = "Aquí saldrá el análisis.";
    };
  </script>
</body>
</html>

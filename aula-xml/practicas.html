    .msg { margin-top: 8px; font-size: 0.9rem; }
    .btn-comprobar {
      margin-top: 10px;
      padding: 8px 16px;
      background: #0f766e;

      border: none;
      border-radius: 6px;

        Tests y ejercicios para comprobar si entiendes las reglas de XML.
      </p>

      <div class="ejercicio">
        <span class="badge">Test</span>
        <h3 style="margin: 8px 0;">1. ¿Qué es un documento bien formado?</h3>
        <label><input type="radio" name="t1" value="a"> Uno que tiene DTD o XSD</label>
        <label><input type="radio" name="t1" value="b"> Uno que cumple las reglas básicas de sintaxis XML</label>
        <label><input type="radio" name="t1" value="c"> Uno escrito solo en minúsculas</label>
        <button type="button" class="btn-comprobar" onclick="corregir('t1','b', this)">Comprobar</button>
        <p class="msg"></p>
      </div>
